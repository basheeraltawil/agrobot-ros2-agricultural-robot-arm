# Joint positions the simulator and the mock hardware start in.
# "home" pose: arm folded beside the column, out of the camera's view, gripper open.
# The rail starts 5 cm off its end stop (a joint that starts exactly on its
# limit is locked by the Gazebo physics engine; the real rail homes to 0 and backs off).
joint_1: -0.97
joint_2: -2.0
joint_3: -1.12
joint_4: 1.46
gripper_jaw_joint: 0.010
rail_joint: 0.05
