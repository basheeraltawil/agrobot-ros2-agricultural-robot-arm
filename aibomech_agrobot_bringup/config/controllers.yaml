# ros2_control controllers. Identical for mock, Gazebo and the real robot, so a
# task that works in simulation sends exactly the same commands to the hardware.
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

    rail_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: [joint_1, joint_2, joint_3, joint_4]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      joint_1: {trajectory: 0.25, goal: 0.02}
      joint_2: {trajectory: 0.25, goal: 0.02}
      joint_3: {trajectory: 0.25, goal: 0.02}
      joint_4: {trajectory: 0.25, goal: 0.02}

gripper_controller:
  ros__parameters:
    joint: gripper_jaw_joint
    goal_tolerance: 0.001
    max_effort: 20.0
    # The jaw stops on the fruit before reaching the commanded position.
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 0.5

rail_controller:
  ros__parameters:
    joints: [rail_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 2.0
      rail_joint: {trajectory: 0.10, goal: 0.005}
