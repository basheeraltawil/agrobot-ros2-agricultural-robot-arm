# Selective strawberry harvesting (world: strawberry_greenhouse)
strawberry_harvest:
  ros__parameters:
    # Rail positions where the camera surveys the row (m)
    survey_stations: [0.35, 0.75, 1.15, 1.55, 1.95, 2.35]
    # Colour classes, HSV in OpenCV units (H 0-179). Each range: h_lo s_lo v_lo h_hi s_hi v_hi
    detection:
      ripe:
        hsv_ranges: [0, 140, 70, 8, 255, 255, 170, 140, 70, 179, 255, 255]
        min_area: 25
        max_area: 2500
        radius: 0.0095
        draw_bgr: [0, 0, 255]
      unripe:
        hsv_ranges: [28, 35, 90, 46, 120, 255]
        min_area: 25
        max_area: 2500
        radius: 0.0095
        draw_bgr: [0, 255, 255]
    # Gripper approach directions (world frame), tried in this order:
    # horizontally into the row, then 20 deg from below / above / either side
    approaches: [0.0, 1.0, 0.0,   0.0, 0.94, 0.34,   0.0, 0.94, -0.34,   0.34, 0.94, 0.0,   -0.34, 0.94, 0.0]
    pregrasp_distance: 0.06
    # Pull back and down after gripping: breaks the peduncle on the real crop
    retreat_offset: [0.0, -0.04, -0.01]
    max_approach_error_deg: 35.0
    # Candidate positions of the fruit relative to the arm along the row (m)
    rail_offsets: [0.16, 0.14, 0.18, 0.12, 0.20, 0.22, 0.10, -0.16, -0.19]
    fruit_width: 0.019
    drop_height: 0.07
    # Crop zone in the world frame [x_min x_max y_min y_max z_min z_max]
    detection_region: [-0.5, 3.5, 0.12, 0.30, 0.80, 1.00]
    # Fixed obstacles for collision checking, world frame boxes [cx cy cz sx sy sz ...]
    # here: the strawberry gutter
    obstacles: [1.5, 0.315, 0.96, 3.6, 0.2, 0.08]
    # Neighbouring fruit is kept out of the gripper's path with boxes of this size.
    # Soft crops can be brushed aside; a stiff crop would need a larger value.
    fruit_obstacle_size: 0.014
    refine_radius: 0.03
    max_fruit: 0          # 0 = all detected ripe fruit
    speed_scale: 0.7
    cartesian_speed: 0.04
