# Precision weeding (world: weeding_bed)
precision_weeding:
  ros__parameters:
    survey_stations: [0.35, 0.75, 1.15, 1.55, 1.95, 2.35]
    detection:
      weed:
        hsv_ranges: [140, 90, 50, 165, 255, 255]
        min_area: 15
        max_area: 3000
        radius: 0.0
        draw_bgr: [255, 0, 255]
      crop:
        hsv_ranges: [40, 80, 90, 51, 140, 255]
        min_area: 300
        max_area: 40000
        radius: 0.0
        draw_bgr: [0, 255, 0]
    detection_region: [-0.5, 3.5, 0.16, 0.44, 0.74, 0.88]
    # Raised bed (soil box) as obstacle [cx cy cz sx sy sz]
    obstacles: [1.4, 0.30, 0.76, 2.6, 0.28, 0.02]
    crop_protection_radius: 0.06   # weeds closer than this to a lettuce are left alone
    crop_obstacle_size: 0.08
    grasp_height_above_detection: 0.03
    stem_width: 0.006
    # Aim the middle of the open jaws at the stem, so the fixed jaw clears it
    tcp_frame: tcp_center
    # The pulled weed (leaf rosette + root ball) for collision checking
    held_half_size: [0.02, 0.02, 0.025]
    held_offset: [0.0, 0.0, 0.02]
    pregrasp_distance: 0.05
    pull_height: 0.08
    drop_height: 0.07
    max_approach_error_deg: 35.0
    rail_offsets: [0.0, 0.05, -0.05, 0.10, -0.10, 0.15, -0.15, 0.03, -0.03]
    max_weeds: 0
    speed_scale: 0.7
    cartesian_speed: 0.04
