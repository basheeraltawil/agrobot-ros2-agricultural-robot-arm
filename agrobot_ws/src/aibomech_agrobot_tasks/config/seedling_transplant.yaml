# Seedling transplanting (world: nursery_transplanting)
seedling_transplant:
  ros__parameters:
    # Taught fixture positions, world frame (m). grasp_z / place_z are TCP heights.
    tray:
      first_cell: [0.45, 0.29]
      pitch: [0.06, 0.06]
      cols: 4
      rows: 2
      grasp_z: 0.797        # 45 mm above the cell floor: jaws grip the top of the soil block
    pots:
      first_pot: [1.10, 0.29]
      pitch: [0.10, 0.075]
      cols: 4
      rows: 2
      place_z: 0.833        # soil block bottom just above the potting soil
    check_occupancy: true
    detection:
      seedling:
        hsv_ranges: [48, 80, 50, 62, 255, 255]
        min_area: 15
        max_area: 3000
        radius: 0.0
        draw_bgr: [0, 255, 0]
    detection_region: [-0.5, 3.5, 0.20, 0.36, 0.74, 0.88]
    # Obstacles [cx cy cz sx sy sz ...]: potting bench top, and the tray up to its wall tops
    obstacles: [1.2, 0.30, 0.733, 2.4, 0.30, 0.03,
                0.54, 0.32, 0.757, 0.25, 0.13, 0.018]
    plug_width: 0.018
    pregrasp_distance: 0.05
    lift_height: 0.06
    max_approach_error_deg: 35.0
    rail_offsets: [0.0, 0.05, -0.05, 0.10, -0.10]
    max_plants: 0           # 0 = whole tray
    speed_scale: 0.7
    cartesian_speed: 0.04
